name: Build portfolio screenshots

on:
  push:
    paths:
      - "scripts/capture_portfolio_screenshots.mjs"
      - "scripts/build_portfolio_gallery.py"
      - ".github/workflows/portfolio-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
          python -m pip install --disable-pip-version-check pillow

      - name: Start AccessHub
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/accesshub-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/accesshub-server.log
          exit 1

      - name: Capture clean screenshots
        run: |
          node scripts/capture_portfolio_screenshots.mjs
          python scripts/build_portfolio_gallery.py

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
            exit 0
          fi
          git commit -m "docs: add clean AccessHub screenshots"
          git push
